[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitwire-linux"
version = "1.0.0"
description = "Network restriction bypass tool for Linux (Ubuntu)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SplitWire-Turkey Contributors"}
]
keywords = ["vpn", "wireguard", "dpi-bypass", "network", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "PyGObject>=3.42.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
splitwire = "splitwire.__main__:main"
splitwire-cli = "splitwire.cli:main"

[project.gui-scripts]
splitwire-gtk = "splitwire.__main__:main"

[project.urls]
Homepage = "https://github.com/cagritaskn/SplitWire-Turkey"
Repository = "https://github.com/cagritaskn/SplitWire-Turkey"
Issues = "https://github.com/cagritaskn/SplitWire-Turkey/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splitwire = [
    "resources/languages/*.json",
    "resources/zapret/*",
    "resources/icons/*",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=splitwire --cov-report=term-missing"
